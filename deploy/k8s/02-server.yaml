# 后端 (Spring Boot) — Deployment + Service
# 资源限制: CPU limit 1 / 内存 limit 1Gi (JVM -Xmx512m 配套, 防 OOMKilled)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: huiji-server
  namespace: huiji
  labels: { app: huiji-server }
spec:
  replicas: 1
  selector:
    matchLabels: { app: huiji-server }
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels: { app: huiji-server }
    spec:
      # ---- 安全加固: 非 root 运行 ----
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: server
          image: registry.cn-hangzhou.aliyuncs.com/<ACR_NAMESPACE>/server:<IMAGE_TAG>
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8081, name: http }
          envFrom:
            - secretRef: { name: huiji-env }
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: prod }
          # ---- 内存/CPU 限制 ----
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/h5/stores
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/h5/stores
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: huiji
spec:
  selector: { app: huiji-server }
  ports:
    - { port: 8081, targetPort: 8081, name: http }
