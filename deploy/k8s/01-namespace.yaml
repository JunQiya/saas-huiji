# 命名空间 + 环境变量 Secret
# 部署前: 用真实值替换并执行
#   kubectl create ns huiji
#   kubectl -n huiji create secret generic huiji-env \
#     --from-literal=DB_URL='jdbc:mysql://<RDS内网地址>:3306/huiji?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true' \
#     --from-literal=DB_USERNAME='huiji_app' \
#     --from-literal=DB_PASSWORD='<密码>' \
#     --from-literal=JWT_SECRET='<随机48位以上>' \
#     --from-literal=H5_DOMAIN='https://h5.example.com' \
#     --from-literal=CORS_ORIGINS='https://admin.example.com,https://h5.example.com' \
#     --from-literal=SMS_DEV_MODE='false'
apiVersion: v1
kind: Namespace
metadata:
  name: huiji
---
apiVersion: v1
kind: Secret
metadata:
  name: huiji-env
  namespace: huiji
type: Opaque
stringData:
  DB_URL: "jdbc:mysql://<RDS_HOST>:3306/huiji?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
  DB_USERNAME: "huiji_app"
  DB_PASSWORD: "<CHANGE_ME>"
  JWT_SECRET: "<CHANGE_ME_48_plus>"
  H5_DOMAIN: "https://h5.example.com"
  CORS_ORIGINS: "https://admin.example.com,https://h5.example.com"
  SMS_DEV_MODE: "false"
  SMS_FIXED_CODE: ""
