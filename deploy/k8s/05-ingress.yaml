# Ingress — 单域名 huiji.lxxno.cn 分发到网关
# 所有路径(/官网、/admin、/h5)都由 gateway 容器内的 nginx 按路径分发, 后端 /api 由网关反代
# 需在阿里云 ASK/ACK 启用 Ingress(ALB Ingress 或 nginx-ingress-controller)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: huiji
  namespace: huiji
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet
    # TLS 证书(阿里云 SSL 证书 ID), 按实际填写
    # alb.ingress.kubernetes.io/certificate-id: "<证书ID>"
    # alb.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: huiji.lxxno.cn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: { number: 80 }
