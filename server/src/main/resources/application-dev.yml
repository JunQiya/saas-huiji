# dev profile: 本地 MySQL, 数据持久化
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/huiji?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  sql:
    init:
      mode: never

huiji:
  init-data: true
  h5:
    sms-dev-mode: true
    sms-code: "8888"

logging:
  level:
    com.huiji: DEBUG
