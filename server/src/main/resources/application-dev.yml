# dev profile: 本地 MySQL, 数据持久化
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/huiji?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  sql:
    init:
      mode: never

huiji:
  init-data: true
  plan-upgrade-free: true
  h5:
    sms-dev-mode: true
    sms-code: "8888"
    mall-demo-pay: true
    recharge-demo-pay: true

# 开发专用 JWT 密钥(长度>=32), 仅用于本地演示; 生产必须用 JWT_SECRET 注入
huiji-jwt:
  secret: ${JWT_SECRET:dev-only-huiji-secret-key-please-change-in-prod-2026}

logging:
  level:
    com.huiji: DEBUG
