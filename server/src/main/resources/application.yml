server:
  port: 8080
  servlet:
    context-path: /

spring:
  profiles:
    active: dev
  application:
    name: huiji-server
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # 数据源(MySQL), 生产环境请通过环境变量 DB_URL/DB_USERNAME/DB_PASSWORD 注入
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/huiji?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        # 自动给 SQL 标识符加反引号, 避免 type/status/trigger 等 MySQL 保留字冲突
        globally_quoted_identifiers: true

# JWT (生产环境请通过环境变量 JWT_SECRET 注入, 密钥长度至少 32 字符)
huiji-jwt:
  secret: ${JWT_SECRET:huiji-secret-key-for-jwt-signing-please-change-in-production-2024}
  expire-minutes: 720
  member-expire-minutes: 1440

# CORS (逗号分隔, @Value List<String> 自动拆分)
huiji-cors:
  allowed-origins: http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174

# 是否初始化演示数据(dev 开启, prod 关闭)
huiji:
  init-data: false
  # H5 前端域名(微信授权回调后重定向使用), 未配置 WxAccount.domain 时回退到此值
  h5-domain: http://localhost:5173
  h5:
    # 短信验证码回显模式(生产必须关闭): true 时验证码直接出现在接口响应中
    sms-dev-mode: false
    # 兜底固定验证码(仅演示环境配置, 生产留空以禁用)
    sms-code: ""

logging:
  level:
    com.huiji: INFO
    org.hibernate.SQL: warn
