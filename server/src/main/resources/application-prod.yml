# prod profile: 生产 MySQL, 数据持久化
# 敏感配置一律通过环境变量注入, 不落明文:
#   DB_URL / DB_USERNAME / DB_PASSWORD / JWT_SECRET
#   H5_DOMAIN(必填, H5 访问域名, 微信授权回调/点餐二维码回跳用)
#   CORS_ORIGINS(可选, 逗号分隔的允许跨域来源; 留空=仅同源, 最安全)
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/huiji?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    # 生产无默认密码: 未通过环境变量注入时启动即失败, 防止弱口令兜底
    password: ${DB_PASSWORD:}
    # ---- HikariCP 连接池(数据库缓存核心) ----
    # 与容器资源匹配: 1核/1Gi 下 6 个连接足够; 每连接约占用 3-5MB, 避免过大撑爆 JVM 堆
    hikari:
      pool-name: HuijiPool
      maximum-pool-size: ${HIKARI_POOL_SIZE:6}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 30000        # 获取连接超时(ms), 避免接口长时间挂起
      idle-timeout: 600000             # 空闲连接回收(ms)
      max-lifetime: 1800000            # 连接最大生命周期(ms), 低于 MySQL wait_timeout
      validation-timeout: 5000
      connection-test-query: SELECT 1  # 保活探测
      leak-detection-threshold: 60000  # 连接泄漏检测(ms), 超时打印告警日志
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  sql:
    init:
      mode: never

# 生产关闭演示数据初始化; 短信验证码回显由 SMS_DEV_MODE 控制
#   - 演示系统(推荐 true): 未接短信网关也能登录, 验证码回显到接口并由前端自动填充
#   - 真实生产(false): 需接入真实短信网关, 否则登录不可用
huiji:
  init-data: false
  plan-upgrade-free: false
  h5:
    sms-dev-mode: ${SMS_DEV_MODE:false}
    sms-code: ${SMS_FIXED_CODE:}
    mall-demo-pay: false
    recharge-demo-pay: false
  # H5 访问域名(如 https://h5.example.com), 微信 OAuth 回调与点餐二维码依赖
  h5-domain: ${H5_DOMAIN:}

# CORS: 生产默认仅同源(经 Nginx 反代), 需要跨域时用 CORS_ORIGINS 显式放开
huiji-cors:
  allowed-origins: ${CORS_ORIGINS:}

